apiVersion: v1
kind: Service
metadata:
  name: raft-node
spec:
  clusterIP: None
  selector:
    app: raft-node
  ports:
    - name: raft
      port: 6000
      targetPort: 6000
    - name: metrics
      port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft-node
spec:
  serviceName: raft-node
  replicas: 3

  selector:
    matchLabels:
      app: raft-node

  template:
    metadata:
      labels:
        app: raft-node

    spec:
      containers:
        - name: raft-node
          image: smart-parking-raft:latest
          imagePullPolicy: Never

          ports:
            - name: raft
              containerPort: 6000
            - name: metrics
              containerPort: 8080

          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: RAFT_ADDRESS
              value: ":6000"

            - name: METRICS_ADDRESS
              value: ":8080"

            - name: NODE_ADDRESSES
              valueFrom:
                configMapKeyRef:
                  name: raft-config
                  key: NODE_ADDRESSES

          command:
            - /app/raft-node