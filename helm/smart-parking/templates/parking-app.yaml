{{- if .Values.parkingApp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-parking
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-parking
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.parkingApp.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-parking
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-parking
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: parking-web
          image: "{{ .Values.parkingApp.image.repository }}:{{ .Values.parkingApp.image.tag }}"
          imagePullPolicy: {{ .Values.parkingApp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.parkingApp.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-parking
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-parking
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.parkingApp.service.type }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-parking
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.parkingApp.service.port }}
      targetPort: http
      protocol: TCP
{{ if .Values.parkingApp.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-parking
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-parking
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.parkingApp.ingress.clusterIssuer | quote }}
spec:
  ingressClassName: {{ .Values.parkingApp.ingress.className | quote }}
  tls:
    - hosts:
        - {{ required "parkingApp.ingress.host is required when ingress is enabled" .Values.parkingApp.ingress.host | quote }}
      secretName: {{ required "parkingApp.ingress.tlsSecretName is required when ingress is enabled" .Values.parkingApp.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.parkingApp.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-parking
                port:
                  name: http
{{ end }}
{{- end }}
