{{- $addresses := .Values.raft.nodeAddresses -}}
{{- if not $addresses -}}
{{- $generated := list -}}
{{- range $index := until (int .Values.replicaCount) -}}
{{- $generated = append $generated (printf "%s-%d.%s:%d" $.Release.Name $index $.Release.Name (int $.Values.raft.port)) -}}
{{- end -}}
{{- $addresses = join "," $generated -}}
{{- else -}}
{{- $addresses = join "," $addresses -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  NODE_ADDRESSES: {{ $addresses | quote }}
