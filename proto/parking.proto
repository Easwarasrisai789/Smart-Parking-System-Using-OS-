syntax = "proto3";

package parking;

option go_package = "smart-parking-kv/proto";

service ParkingService {
    rpc Enter(EnterRequest) returns (ParkingResponse);
    rpc Exit(ExitRequest) returns (ParkingResponse);
    rpc Status(StatusRequest) returns (ParkingResponse);
}

service RaftService {
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message EnterRequest {
    string slot_id = 1;
    string vehicle_id = 2;
}

message ExitRequest {
    string slot_id = 1;
    string vehicle_id = 2;
}

message StatusRequest {
    string slot_id = 1;
}

message ParkingResponse {
    bool success = 1;
    string message = 2;
}

/*
   Raft RequestVote messages
*/

message RequestVoteRequest {
    int32 term = 1;
    int32 candidate_id = 2;
    int32 last_log_index = 3;
    int32 last_log_term = 4;
}

message RequestVoteResponse {
    int32 term = 1;
    bool vote_granted = 2;
}

/*
   Raft AppendEntries messages
*/

message RaftLogEntry {
    int32 term = 1;
    string command = 2;
}

message AppendEntriesRequest {
    int32 term = 1;
    int32 leader_id = 2;
    int32 prev_log_index = 3;
    int32 prev_log_term = 4;
    repeated RaftLogEntry entries = 5;
    int32 leader_commit = 6;
}

message AppendEntriesResponse {
    int32 term = 1;
    bool success = 2;
}